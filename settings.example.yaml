# Copy this file to settings.yaml in YOUR PRIVATE copy of the repo and edit it.
# Everything the bot does is driven from here.

profile:
  name: "Your Name"
  email: "you@example.com"
  phone: "+44 7000 000000"
  linkedin: "linkedin.com/in/your-profile"

# Your CV as a Word file. Tailored copies keep its exact design.
cv_path: "cv/cv.docx"
# Tailored CVs must fit on this many pages (extra items are trimmed, least relevant first).
max_pages: 1

search:
  # Job titles to look for, highest priority first. Matched against job titles.
  roles:
    - Data Engineer
    - AI Engineer
    - ML Engineer
    - Machine Learning Engineer
    - Analytics Engineer
    - Data Scientist
  # Titles containing any of these words are skipped.
  exclude_title_words: [Intern, Internship, Graduate, Junior, Head of, Director, VP, Chief, Apprentice]
  # Jobs posted more than this many days ago are skipped.
  max_age_days: 21
  # Places you'd work in person. A job matches if its location contains any of these.
  # The first entry is ranked highest.
  locations: [London, Reading, Slough, Watford, St Albans, Guildford, Woking, Croydon, Cambridge, Oxford, Brighton, Milton Keynes]
  # Accept fully remote jobs in this country.
  remote_ok: true
  country: "UK"
  # Skip jobs whose advertised maximum salary is below this. Jobs with no salary listed are kept.
  min_salary: 50000
  currency: "GBP"
  # Companies you never want to apply to.
  exclude_companies: ["Your Current Employer"]

  # Company job boards searched directly (free, no API key).
  # ats: greenhouse | lever | ashby ; token: the company's board name in its careers URL.
  # Add your own: https://boards.greenhouse.io/<token>, https://jobs.lever.co/<token>, https://jobs.ashbyhq.com/<token>
  companies:
    - {name: Monzo, ats: greenhouse, token: monzo}
    - {name: Deliveroo, ats: greenhouse, token: deliveroo}
    - {name: GoCardless, ats: greenhouse, token: gocardless}
    - {name: Tide, ats: greenhouse, token: tide}
    - {name: Anthropic, ats: greenhouse, token: anthropic}
    - {name: Palantir, ats: lever, token: palantir}
    - {name: ElevenLabs, ats: ashby, token: elevenlabs}
    - {name: Synthesia, ats: ashby, token: synthesia}

  # Optional aggregators (API keys set as secrets; Reed is free, Adzuna is paid after 25 trial calls):
  # ADZUNA_APP_ID + ADZUNA_APP_KEY  -> https://developer.adzuna.com
  # REED_API_KEY                    -> https://www.reed.co.uk/developers/jobseeker
  # LinkedIn's public job search (no login: your LinkedIn account is never used).
  # Searches your first location (within distance_miles) and, if remote_ok, remote jobs in your country.
  # Easy Apply jobs go to your approval queue; jobs that apply on a company site are handled like any other.
  # alert_emails: also read your LinkedIn job-alert emails from Gmail (secrets GMAIL_ADDRESS, GMAIL_APP_PASSWORD).
  linkedin:
    enabled: true
    pages_per_role: 2
    distance_miles: 25
    easy_apply_only: false
    alert_emails: {enabled: true, days: 3, max_jobs: 60}
  adzuna: {enabled: true, results_per_role: 50}
  reed: {enabled: true, results_per_role: 50}

matching:
  # Jobs scoring below this (0-100) against your CV are skipped.
  min_fit_score: 70
  # At most this many jobs are scored per run (best matches first), to keep the run under an hour.
  # Your own rules for judging fit, in plain English. Claude follows them when scoring and checking jobs.
  rules: []
  #  - "Roles asking for up to 5 years of experience are still worth applying to."
  # Titles you want to apply to whatever the score (a hard deal-breaker like clearance still stops them).
  always_apply_titles: []
  max_screen_per_run: 60
  # How to reach Claude:
  #   claude-code: uses your Claude subscription via Claude Code (secret CLAUDE_CODE_OAUTH_TOKEN). No API bill.
  #   anthropic:   uses the Claude API (secret ANTHROPIC_API_KEY), billed per use.
  provider: "claude-code"
  # Light model that scores every matching job first.
  # (claude-code takes haiku / sonnet / opus; anthropic takes full ids like claude-haiku-5-5)
  screen_model: "haiku"
  # Stronger model that analyses keywords and tailors the CV, only for jobs that pass screening.
  model: "sonnet"

# Skills you really have that aren't written on your CV. The tailoring step may
# add these; it will never add anything that is in neither your CV nor this list.
extra_skills: []

# Answers used for application screening questions.
answers:
  right_to_work: "Yes"
  needs_sponsorship: "No"
  notice_period: "1 month"
  # Tells the scorer what level you're aiming for, so a "Senior" title alone doesn't rule a job out.
  experience: "About 4 years in tech. Happy with any role that asks for 2+ years of experience."
  # Used when the job has no posted range. With a posted range, the middle of it is used.
  expected_salary: 55000
  # Optional answers for equal-opportunity questions (leave out to have the helper stop and ask you).
  # Optional diversity answers. "A|B" means: use A, or B when A isn't one of the choices.
  # Anything left out is answered "Prefer not to say".
  # gender: "Female|Woman"
  # ethnicity: "Prefer not to say"
  # age_range: "Under 30|Prefer not to say"
  # sexual_orientation: "Prefer not to say"
  # transgender: "Prefer not to say"
  # disability: "Prefer not to say"
  # communities: "Prefer not to say"
  # nationality: ""
  # religion: "Prefer not to say"

apply:
  daily_cap_linkedin: 15
  daily_cap_auto: 15
  # LinkedIn jobs that apply on a company site (the laptop helper finds the link). Defaults to daily_cap_linkedin.
  # daily_cap_manual: 15

# Morning email with the day's numbers, queues and anything that needs you. Uses the GMAIL_ADDRESS and
# GMAIL_APP_PASSWORD secrets to send. "to" defaults to profile.email.
digest:
  enabled: true
  to: ""

# Google Sheet copy of the tracker (see docs/SETUP.md, "Google Sheet"). Put the sheet's link here so the
# morning email links to it.
sheet:
  url: ""
